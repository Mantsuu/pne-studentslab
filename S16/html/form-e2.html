<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Echo Server</title>
</head>
<body style="background-color: yellow;">
    <h1>Echo Server</h1>
    <form action="echo" method="get">
        Message: <br>
        <input type="text" name="msg">
        <input type="submit" value="SEND">
        <br>
        Echo in capital letters:
        <input type="checkbox" name="chk">
    </form>
</body>
</html>
